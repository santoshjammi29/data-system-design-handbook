[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-system-design-handbook"
version = "1.0.0"
description = "Enterprise data platform architectures, high-scale system design case studies, and trade-off matrices for Staff and Principal Architects."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Santosh Jammi"}
]
keywords = ["data-engineering", "lakehouse", "data systems design & enterprise architecture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
